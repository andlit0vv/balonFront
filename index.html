<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0B0A">
<title>BALON Drop 01</title>
<meta name="description" content="BALON — лимитированный дроп вязаных шапок. Доставка СДЭК по всей России.">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/site.css?v=3">
<style>
/* Shop page: splash, catalog = edge-to-edge sticky stacked cards, product, checkout, pickup point picker */

/* ---------- splash ---------- */
html.splash-open,body.splash-open{overflow:hidden;overscroll-behavior:none;height:100%;height:100dvh}
body.splash-open > :is(header,main,footer,.menu,.cookie,.toast){display:none}
.splash{position:fixed;inset:0;z-index:100;background:#071314;color:#fff;overflow:hidden;transition:transform .8s cubic-bezier(.77,0,.18,1),visibility .8s}
.splash.gone{transform:translateY(-100%);visibility:hidden;pointer-events:none}
.splash .hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.splash::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 28%,transparent 65%,rgba(0,0,0,.7))}
.splash .top{position:absolute;z-index:1;top:calc(var(--top) + 32px);left:0;right:0;display:flex;justify-content:center}
.splash .top svg{height:42px;width:auto;color:#fff}
.splash .cta{position:absolute;z-index:1;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);transform:translateX(-50%);display:flex;align-items:center;gap:24px;padding:16px 4px;border:0;border-bottom:1px solid rgba(255,255,255,.65);background:none;color:#fff;font-weight:800;font-size:clamp(16px,2vw,28px);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.splash .cta svg{width:28px;height:28px;transition:transform .3s}
.splash .cta:hover svg{transform:translateX(6px)}
@media (max-aspect-ratio:1/1){
  .splash .hero-photo{object-fit:cover;object-position:51% center}
  .splash::after{background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,transparent 70%,rgba(0,0,0,.5))}
  .splash .top{top:calc(var(--top) + 40px)}
  .splash .top svg{height:36px}
  .splash .cta{bottom:calc(env(safe-area-inset-bottom,0px) + 8vh)}
}

/* ---------- views ---------- */
.view{display:none}
.view.on{display:block;animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- collection ---------- */
.collection-head{display:flex;justify-content:space-between;align-items:end;gap:24px;padding:44px 0 28px}
.collection-head h1{font-size:clamp(36px,6vw,76px);margin-top:12px}
.collection-head p{max-width:28ch;color:var(--fg-2);margin:0}
#v-shop{padding:0 var(--gut) 64px}
.stack{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{display:block;text-decoration:none;min-width:0}
.card-media{position:relative;aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.card-media img{width:82%;height:82%;object-fit:contain;transition:transform .35s}
.card:hover img{transform:scale(1.05)}
.card-number{position:absolute;top:14px;left:14px;font-size:11px;color:var(--fg-2)}
.card-body{padding:18px 0;display:grid;gap:8px}
.card h2{font-size:clamp(17px,1.6vw,24px);line-height:1.1;text-transform:uppercase}
.card-body p{margin:0;color:var(--fg-2);font-size:13px}
.card-price{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:4px;font-weight:600}
.card-price svg{width:20px;height:20px}
.collection-story{margin-top:48px;position:relative}
.collection-story img{display:block;width:100%;max-height:640px;object-fit:cover}
.collection-story p{margin:12px 0 0;color:var(--fg-2);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
@media(max-width:899px){.stack{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.collection-head{padding-top:28px}.collection-head p{display:none}.card-body{padding:14px 0}.collection-story{margin-top:28px}}
.c-coral{--grad:radial-gradient(45% 75% at 30% 40%,rgba(226,83,106,.30),transparent 70%),radial-gradient(40% 60% at 80% 50%,rgba(70,180,170,.22),transparent 70%),linear-gradient(135deg,#0A1312,#0D1A19);background:var(--grad)}
.c-gold{--grad:radial-gradient(45% 75% at 30% 40%,rgba(214,168,40,.24),transparent 70%),radial-gradient(40% 60% at 80% 50%,rgba(214,168,40,.16),transparent 70%),linear-gradient(135deg,#0C0B08,#14120D);background:var(--grad)}
.c-night{--grad:radial-gradient(45% 75% at 30% 40%,rgba(80,110,180,.26),transparent 70%),radial-gradient(40% 60% at 80% 50%,rgba(80,110,180,.16),transparent 70%),linear-gradient(135deg,#06080D,#0B0F18);background:var(--grad)}
.c-white{--grad:radial-gradient(45% 75% at 30% 40%,rgba(225,230,235,.20),transparent 70%),radial-gradient(40% 60% at 80% 50%,rgba(225,230,235,.12),transparent 70%),linear-gradient(135deg,#0E0F10,#161819);background:var(--grad)}
/* ---------- product page ---------- */
.pgrid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(16px,3vw,48px);padding-bottom:72px}
@media (max-width:899px){.pgrid{grid-template-columns:1fr;gap:28px}}
.gal{min-width:0}
.gal .main{position:relative;aspect-ratio:4/5;max-height:calc(100svh - var(--hdr) - 120px);width:100%;overflow:hidden;color:#fff;background:var(--bg-2)}
@media (min-width:900px){.gal .main{aspect-ratio:auto;height:calc(100svh - var(--hdr) - 130px);min-height:520px}}
.gal .gs{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;display:grid;place-items:center}
.gal .gs.on{opacity:1}
.gal .gs img.cut{width:min(70%,620px);filter:drop-shadow(0 50px 60px rgba(0,0,0,.6))}
.gal .gs.ph{background-size:cover;background-position:center}
.gal .gs.model svg.model{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:90%;width:auto}
.gal .gs.model .cap{position:absolute;top:18px;left:18px;display:grid;gap:4px}
.gal .gnav{position:absolute;left:16px;right:16px;bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.gal .gnav .cnt{height:52px;display:inline-flex;align-items:center;padding:0 16px;font-size:12px;font-weight:600;letter-spacing:.16em;color:#fff;background:rgba(0,0,0,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.gal .gnav .arrows{display:flex;gap:6px}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.thumbs button{aspect-ratio:4/3;border:1px solid transparent;padding:0;background-color:var(--bg-2);background-size:cover;background-position:center;position:relative;opacity:.5;transition:opacity .2s,border-color .2s;overflow:hidden}
.thumbs button.on{opacity:1;border-color:var(--fg)}
.thumbs button svg.model{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:90%;width:auto}
.thumbs button span{position:absolute;left:8px;bottom:6px;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.info{min-width:0;align-self:start;position:sticky;top:calc(var(--top) + var(--hdr) + 22px);display:grid;gap:22px}
@media (max-width:899px){.info{position:static}}
.info h1{font-size:clamp(40px,5.6vw,92px);text-transform:uppercase}
.info .price{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-block:18px;border-block:1px solid var(--line)}
.info .price b{font-size:30px;font-weight:800;letter-spacing:-.01em}
.specs{display:grid;margin:0}
.specs div{display:grid;grid-template-columns:140px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
@media (max-width:480px){.specs div{grid-template-columns:104px 1fr}}
.specs dt{color:var(--fg-2)}.specs dd{margin:0;font-weight:500}
.qty{display:flex;align-items:center;border:1px solid var(--line);height:56px}
.qty button{width:48px;height:100%;border:0;background:none;font-size:20px}
.qty span{min-width:32px;text-align:center;font-weight:600}
.buy{display:grid;grid-template-columns:auto 1fr;gap:8px}
.buy .btn{width:100%;min-width:0;padding:0 16px;gap:12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:64px;height:64px;padding:0;border:1px solid var(--line);transition:border-color .2s}
.swatches button.on{border:2px solid var(--fg)}

/* ---------- checkout ---------- */
.co{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(16px,3vw,48px);padding-bottom:80px}
@media (max-width:899px){.co{grid-template-columns:1fr;gap:8px}}
#cart h1{font-size:clamp(40px,7vw,110px);text-transform:uppercase;padding-block:8px 28px}
.fs{border:0;margin:0 0 36px;padding:0;display:grid;gap:12px;min-width:0}
.fs legend{padding:0;margin-bottom:14px;display:flex;gap:14px;align-items:baseline}
.fs legend b{font-size:22px;font-weight:800;letter-spacing:-.01em}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.g3,.g2{grid-template-columns:1fr}}
.fld{position:relative;display:grid}
.fld input,.fld select{height:60px;border:1px solid var(--line);background:var(--bg-2);padding:22px 14px 6px;outline:none;transition:border-color .2s;appearance:none;-webkit-appearance:none;width:100%;min-width:0;font-size:16px}
.fld select{padding-right:40px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1.5 6 6.5 11 1.5' fill='none' stroke='%238C928D' stroke-width='1.4'/></svg>");background-repeat:no-repeat;background-position:right 16px center}
.fld input:focus,.fld select:focus{border-color:var(--fg)}
.fld label{position:absolute;left:14px;top:9px;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2);pointer-events:none}
.fld.err input,.pick.err{border-color:#E0675B}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
.seg button{height:56px;border:0;background:none;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2)}
.seg button.on{background:var(--fg);color:var(--bg)}
.pick{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:12px;height:60px;border:1px solid var(--line);background:var(--bg-2);padding:22px 14px 8px;text-align:left;transition:border-color .2s;width:100%}
.pick:hover{border-color:var(--fg)}
.pick .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.pick .v.ph{color:var(--fg-2)}
.pick .a{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fg)}
.pick .a svg{width:16px;height:16px}
.pick .lb{position:absolute;left:14px;top:9px;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2);pointer-events:none}
.cdek{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:16px 18px;border:1px solid var(--line);background:var(--bg-2)}
.cdek .lg{font-weight:800;font-size:22px;letter-spacing:.02em;color:#1AB248;line-height:1}
.cdek .cost{font-weight:800;font-size:18px;white-space:nowrap}
@media (max-width:420px){.cdek{grid-template-columns:auto 1fr;gap:6px 14px}.cdek .cost{grid-column:2}}
.note{font-size:13px;color:var(--fg-2);display:flex;gap:10px;align-items:flex-start}
.note svg{flex:none;width:16px;height:16px;margin-top:2px}
.sum{align-self:start;position:sticky;top:calc(var(--top) + var(--hdr) + 22px);border:1px solid var(--line);background:rgba(255,255,255,.03);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0}
@media (max-width:899px){.sum{position:static}}
.sum .hd{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.line{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.line .im{width:72px;height:72px}
.line .nm{font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.line .rm{border:0;background:none;padding:0;color:var(--fg-2);font-size:12px;text-decoration:underline;text-underline-offset:3px}
@media (max-width:420px){.line{grid-template-columns:56px minmax(0,1fr) auto;padding:14px 16px;gap:12px}.line .im{width:56px;height:56px}}
.tot{padding:16px 20px;display:grid;gap:8px}
.tot div{display:flex;justify-content:space-between;gap:16px}
.tot .big{padding-top:14px;margin-top:6px;border-top:1px solid var(--line);font-size:24px;font-weight:800;letter-spacing:-.01em}
.agree{display:grid;gap:14px;padding:4px 20px 18px}
.sum .btn{width:calc(100% - 40px);margin:0 20px}
.sum .legal{margin:12px 20px 20px;font-size:12px;line-height:1.5;color:var(--fg-2)}
.sum .legal a{color:var(--fg);text-underline-offset:3px}
.empty{padding:40px 20px;text-align:center;display:grid;gap:16px;justify-items:center}

/* ---------- pickup point picker (stub until the CDEK widget is connected) ---------- */
.pvzm{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .3s ease}
.pvzm .box{width:min(1120px,100%);height:min(740px,100%);display:grid;grid-template-rows:auto auto auto minmax(0,1fr);background:var(--bg);border:1px solid var(--line);overflow:hidden}
.pvzm .top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 20px;border-bottom:1px solid var(--line)}
.pvzm .top b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:4px}
.pvzm .top .ico{border:1px solid var(--line);width:44px;height:44px;opacity:1}
.pvzm .tools{display:flex;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pvzm .srch{flex:1 1 260px;display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border:1px solid var(--line);background:var(--bg-2)}
.pvzm .srch:focus-within{border-color:var(--fg)}
.pvzm .srch svg{width:18px;height:18px;color:var(--fg-2);flex:none}
.pvzm .srch input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-size:16px}
.pvzm .chips{display:flex;border:1px solid var(--line)}
.pvzm .chips button{height:46px;padding:0 14px;border:0;background:none;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2)}
.pvzm .chips button.on{background:var(--fg);color:var(--bg)}
.pvzm .tabs{display:none}
.pvzm .body{display:grid;grid-template-columns:400px minmax(0,1fr);min-height:0}
.pvzm .list{scrollbar-width:thin;scrollbar-color:var(--bg-3) transparent;overflow-y:auto;overscroll-behavior:contain;border-right:1px solid var(--line)}
.pvzm .pt{display:grid;gap:6px;padding:16px 20px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s}
.pvzm .pt:hover{background:rgba(255,255,255,.03)}
.pvzm .pt.on{background:var(--bg-2);box-shadow:inset 2px 0 0 var(--accent)}
.pvzm .pt .h{display:flex;justify-content:space-between;gap:12px}
.pvzm .pt b{font-weight:700;font-size:16px;line-height:1.3}
.pvzm .pt .s{font-size:13px;color:var(--fg-2)}
.pvzm .pt .btn{min-height:44px;margin-top:8px;width:100%;font-size:11px}
.pvzm .pt:not(.on) .btn{display:none}
.pvzm .none{padding:40px 20px;color:var(--fg-2);text-align:center}
.pvzm .map{position:relative;overflow:hidden;background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 56px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 56px),var(--bg-2)}
.pvzm .map > svg.roads{position:absolute;inset:0;width:100%;height:100%}
.pvzm #pins{position:absolute;inset:48px 20px 130px}
.pvzm .map .demo{position:absolute;top:14px;left:16px;z-index:2}
.pvzm .pin{position:absolute;z-index:1;width:30px;height:30px;margin:-30px 0 0 -15px;padding:0;border:0;background:none;color:var(--fg-2);transition:color .2s,transform .2s;transform-origin:50% 100%}
.pvzm .pin svg{width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.pvzm .pin.post{color:#5E6661}
.pvzm .pin:hover{color:var(--fg)}
.pvzm .pin.on{color:var(--accent);transform:scale(1.35);z-index:2}
.pvzm .focus{position:absolute;left:16px;right:16px;bottom:16px;z-index:3;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 16px 16px 20px;background:rgba(10,11,10,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.pvzm .focus b{display:block;font-size:16px;line-height:1.3}
.pvzm .focus .s{font-size:13px;color:var(--fg-2)}
@media (max-width:899px){
  .pvzm{padding:0}
  .pvzm .box{width:100%;height:100%;border:0;padding-top:var(--top);padding-bottom:env(safe-area-inset-bottom,0px)}
  .pvzm .top{padding:12px var(--gut-r) 12px var(--gut)}
  .pvzm .tools{padding:12px var(--gut-r) 12px var(--gut)}
  .pvzm .chips{flex:1}.pvzm .chips button{flex:1;padding:0 8px}
  .pvzm .tabs{display:grid;margin:0 var(--gut-r) 12px var(--gut)}
  .pvzm .tabs button{height:44px}
  .pvzm .tabs button.on{background:none;color:var(--fg);box-shadow:inset 0 -2px 0 var(--fg)}
  .pvzm #pins{inset:44px 16px 200px}
  .pvzm .body{grid-template-columns:1fr;border-top:1px solid var(--line)}
  .pvzm .list{border-right:0}
  .pvzm .pt{padding:16px var(--gut-r) 16px var(--gut)}
  .pvzm .body[data-tab="list"] .map,.pvzm .body[data-tab="map"] .list{display:none}
  .pvzm .focus{grid-template-columns:1fr;left:12px;right:12px;bottom:12px}
  .pvzm .focus .btn{width:100%}
}

/* ---------- pay overlay ---------- */
.pay{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:16px}
.pay .box{background:var(--bg-2);border:1px solid var(--line);width:min(460px,100%);padding:clamp(22px,5vw,32px);display:grid;gap:18px}
.pay .bar{height:2px;background:var(--line);overflow:hidden}
.pay .bar i{display:block;height:100%;width:40%;background:var(--fg);animation:load 1.2s ease-in-out infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.pay .btn{background:transparent;color:var(--fg);border-color:var(--line)}
/* Product hierarchy and checkout layout */
.pgrid{row-gap:24px;align-items:start;grid-template-rows:min-content 1fr}
.product-heading{grid-column:2;grid-row:1;display:grid;gap:16px;padding-top:8px}
.product-heading h1{font-size:clamp(32px,4vw,64px);text-transform:uppercase}
.product-price{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.product-price b{font-size:26px}
.pgrid .gal{grid-column:1;grid-row:1/3}
.pgrid .info{grid-column:2;grid-row:2;position:static;gap:22px}
.thumbs{grid-template-columns:repeat(2,minmax(0,100px))}
.thumbs button{aspect-ratio:1}
.co{grid-template-rows:auto 1fr;row-gap:20px}
.co #f{grid-column:1;grid-row:1/3}
.order-summary{grid-column:2;grid-row:1;position:static}
.payment-summary{grid-column:2;grid-row:2;position:static}
.cart-qty{display:flex;align-items:center;gap:4px;margin:10px 0}
.cart-qty button{border:1px solid var(--line);background:transparent;width:36px;height:36px;font-size:20px}
.cart-qty button:disabled{opacity:.35;cursor:default}
.cart-qty span{min-width:28px;text-align:center}
.empty-cart{min-height:55svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;padding:48px 0}
#cart .empty-cart h1{font-size:clamp(38px,7vw,76px);padding:0}
.empty-cart p{color:var(--fg-2);margin:0}
.empty-cart .btn{margin-top:8px}
@media(max-width:899px){
 .pgrid{display:flex;flex-direction:column;gap:22px;padding-bottom:36px}
 .product-heading,.pgrid .gal,.pgrid .info{width:100%}
 .product-heading{gap:12px;padding-top:0}
 .product-heading h1{font-size:36px}
 .product-price{padding-bottom:0;border:0}
 .gal .main{aspect-ratio:1;max-height:50svh}
 .gal .gs img.cut{width:75%;height:78%;object-fit:contain}
 .gal .gnav{left:10px;right:10px;bottom:10px}

       ${mode==='pvz'?`<button type="button" class="pick" id="pick"><span class="lb">${pv?TYPE[pv.t]:'Пункт выдачи'}</span><span class="v ${pv?'':'ph'}">${pv?esc(pv.a):'Не выбран'}</span><span class="a">${pv?'Изменить':'Выбрать'}${arr}</span></button>`:fld("addr","Адрес: улица, дом, квартира","text","street-address")}</div>
      <div class="cdek"><span class="lg" aria-label="СДЭК">СДЭК</span><div><b>${mode==='pvz'?(pv?esc(pv.a):'До пункта выдачи'):'Курьером до двери'}</b><div class="muted" style="font-size:13px">${form.city}, ${d[1]}${pv?' · '+esc(pv.h):''}</div></div><span class="cost">${ship?rub(ship):'—'}</span></div>
      <div class="note"><svg><use href="#info"/></svg><span>Доставку оплачивает покупатель. Стоимость рассчитывается по тарифу СДЭК для вашего города и входит в сумму к оплате. Подробнее — <a href="delivery.html" target="_blank">доставка, оплата и возврат</a>.</span></div>
     </fieldset>
    </form>
    <aside class="sum order-summary">
     <div class="hd"><span class="label">Ваш заказ</span><span class="label muted">${items.reduce((a,x)=>a+x.q,0)} шт.</span></div>
     ${items.length?items.map(x=>`<div class="line"><div class="im ${x.cls}" style="background-image:url(${IMG[x.img].cut}),var(--grad);background-size:84%,cover;background-repeat:no-repeat;background-position:center"></div><div style="min-width:0"><div class="nm">${x.name}</div><div class="muted" style="font-size:13px">${x.color}</div><div class="cart-qty"><button data-qty="${x.id}" data-delta="-1" aria-label="Уменьшить количество ${x.name}" ${x.q<=1?'disabled':''}>−</button><span>${x.q}</span><button data-qty="${x.id}" data-delta="1" aria-label="Увеличить количество ${x.name}">+</button></div><button class="rm" data-rm="${x.id}">Удалить</button></div><b style="white-space:nowrap">${rub(x.price*x.q)}</b></div>`).join(""):
      `<div class="empty"><span class="muted">В корзине пока пусто</span><button class="btn" data-go="shop">В каталог${arr}</button></div>`}
    </aside>
    <aside class="sum payment-summary">
     <div class="tot"><div><span class="muted">Товары</span><span>${rub(sub)}</span></div><div><span class="muted">Доставка СДЭК</span><span>${ship?rub(ship):'—'}</span></div><div class="big"><span>К оплате</span><span>${rub(sub+(ship||0))}</span></div></div>
     <div class="agree">
      <label class="consent"><input type="checkbox" id="ok" ${form.ok?'checked':''}><span>Я даю <a href="consent.html" target="_blank">согласие на обработку персональных данных</a></span></label>
      <label class="consent"><input type="checkbox" id="news" ${form.news?'checked':''}><span>Хочу получать <a href="marketing-consent.html" target="_blank">новости</a> о новых дропах и акциях</span></label>
     </div>
     <button class="btn" id="pay" ${items.length&&form.ok?'':'disabled'}>Оплатить${arr}</button>
     <p class="legal">Нажимая «Оплатить», вы принимаете условия <a href="oferta.html" target="_blank">публичной оферты</a> и подтверждаете, что ознакомились с <a href="privacy.html" target="_blank">Политикой обработки персональных данных</a>.</p>
    </aside>
   </div>`;
  document.querySelectorAll("#f input").forEach(i=>i.oninput=()=>{form[i.id]=i.value;i.parentElement.classList.remove("err");i.removeAttribute("aria-invalid")});
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;cartView()});
  $("#city").onchange=e=>{form.city=e.target.value;form.pvz=null;cartView()};
  const pick=$("#pick"); if(pick) pick.onclick=()=>pvzPicker();
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{cart=cart.filter(c=>c.id!==b.dataset.rm);save();cartView()});
  document.querySelectorAll("[data-qty]").forEach(b=>b.onclick=()=>{const item=cart.find(c=>c.id===b.dataset.qty);item.q=Math.max(1,item.q+Number(b.dataset.delta));save();cartView()});
  $("#f").onsubmit=e=>{e.preventDefault();if(!$("#pay").disabled)$("#pay").click()};
  $("#ok").onchange=e=>{form.ok=e.target.checked;$("#pay").disabled=!(items.length&&form.ok)};
  $("#news").onchange=e=>{form.news=e.target.checked};
  $("#pay").onclick=()=>{
    let bad=false;["last","first","email","phone"].forEach(k=>{const el=$("#"+k);if(!el.value.trim()||(k==="email"&&!el.validity.valid)||(k==="phone"&&el.value.replace(/\D/g,"").length<10)){el.parentElement.classList.add("err");el.setAttribute("aria-invalid","true");bad=true}});
    if(mode==="cur"){const a=$("#addr");if(!a.value.trim()){a.parentElement.classList.add("err");bad=true}}
    if(mode==="pvz"&&!pv){$("#pick").classList.add("err");bad=true}
    if(bad){toast(mode==="pvz"&&!pv?"Заполните поля и выберите пункт выдачи":"Заполните отмеченные поля");return}
    const o=document.createElement("div");o.className="pay";o.innerHTML=`<div class="box"><span class="label muted">Заказ №B-${String(Date.now()).slice(-5)}</span><b style="font-size:26px;font-weight:800">Переходим к оплате</b><span class="muted">Сумма ${rub(sub+(ship||0))}, включая доставку СДЭК. Оплата проходит на защищённой странице ЮKassa, данные карты мы не видим и не храним.</span><div class="bar"><i></i></div><button class="btn" id="pc">Вернуться к заказу${arr}</button></div>`;
    document.body.append(o);o.querySelector("#pc").onclick=()=>o.remove();
  };
}
const fld=(id,l,t="text",ac="")=>`<div class="fld"><input id="${id}" type="${t}" value="${esc(form[id]||'')}" placeholder=" "${ac?` autocomplete="${ac}"`:''}><label for="${id}">${l}</label></div>`;

/* ---------- pickup point picker: list + demo map, like the CDEK widget ---------- */
function pvzPicker(){
  const all=PVZ[form.city]||[], d=CITY[form.city];
  let q="", f="all", cur=form.pvz||(all[0]&&all[0].id);
  const m=document.createElement("div");
  m.className="pvzm";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("aria-label","Выбор пункта выдачи");
  m.innerHTML=`<div class="box">
    <div class="top"><div><span class="label muted">СДЭК · ${form.city} · ${d[1]} · ${rub(d[0])}</span><b>Пункт выдачи</b></div><button class="ico" data-x aria-label="Закрыть"><svg><use href="#close"/></svg></button></div>
    <div class="tools"><label class="srch"><svg><use href="#search"/></svg><input id="pq" type="search" placeholder="Улица, метро или ТЦ" aria-label="Поиск пункта выдачи"></label>
     <div class="chips">${[["all","Все"],["pvz","Пункты"],["post","Постаматы"]].map(([k,t])=>`<button type="button" data-f="${k}" class="${k===f?'on':''}">${t}</button>`).join("")}</div></div>
    <div class="seg tabs"><button type="button" data-t="list" class="on">Списком</button><button type="button" data-t="map">На карте</button></div>
    <div class="body" data-tab="list">
     <div class="list" id="pl"></div>
     <div class="map" id="pm">
      <svg class="roads" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
       <path d="M-5 62C20 58 30 70 48 64S78 44 105 52" fill="none" stroke="rgba(143,217,174,.07)" stroke-width="5"/>
       <ellipse cx="48" cy="46" rx="30" ry="32" fill="none" stroke="rgba(255,255,255,.06)" stroke-width=".9"/>
       <ellipse cx="48" cy="46" rx="14" ry="15" fill="none" stroke="rgba(255,255,255,.06)" stroke-width=".7"/>
       <path d="M48 -5V105M-5 46H105M10 5 86 92M88 4 12 90" fill="none" stroke="rgba(255,255,255,.05)" stroke-width=".7"/>
      </svg>
      <span class="label muted demo">Демо-карта · заглушка</span>
      <div id="pins"></div>
      <div class="focus" id="pf"></div>
     </div>
    </div>
   </div>`;
  document.body.append(m);document.body.classList.add("lock");
  const close=()=>{m.remove();document.body.classList.remove("lock");removeEventListener("keydown",onKey)};
  const onKey=e=>{if(e.key==="Escape")close()};
  addEventListener("keydown",onKey);
  const choose=id=>{form.pvz=id;close();cartView()};
  const shown=()=>all.filter(p=>(f==="all"||p.t===f)&&(!q||(p.a+" "+p.m).toLowerCase().includes(q)));
  const draw=()=>{
    const list=shown();
    if(!list.some(p=>p.id===cur))cur=list[0]&&list[0].id;
    m.querySelector("#pl").innerHTML=list.length?list.map(p=>`<div class="pt ${p.id===cur?'on':''}" data-id="${p.id}" tabindex="0">
      <div class="h"><span class="label muted">${TYPE[p.t]}</span><span class="label muted">${d[1]}</span></div>
      <b>${esc(p.a)}</b><span class="s">${esc(p.m)} · ${esc(p.h)}</span>
      <button type="button" class="btn" data-pick="${p.id}">Забрать здесь${arr}</button></div>`).join(""):`<div class="none">Ничего не нашли. Попробуйте другой адрес или станцию метро.</div>`;
    m.querySelector("#pins").innerHTML=list.map(p=>`<button type="button" class="pin ${p.t} ${p.id===cur?'on':''}" data-id="${p.id}" style="left:${p.x}%;top:${p.y}%" aria-label="${esc(TYPE[p.t]+', '+p.a)}"><svg><use href="#pin"/></svg></button>`).join("");
    const c=list.find(p=>p.id===cur);
    const pf=m.querySelector("#pf");pf.hidden=!c;
    if(c)pf.innerHTML=`<div style="min-width:0"><span class="label muted">${TYPE[c.t]} · ${rub(d[0])}</span><b>${esc(c.a)}</b><span class="s">${esc(c.m)} · ${esc(c.h)}</span></div><button type="button" class="btn" data-pick="${c.id}">Забрать здесь${arr}</button>`;
  };
  m.addEventListener("click",e=>{
    if(e.target===m||e.target.closest("[data-x]"))return close();
    const pk=e.target.closest("[data-pick]");if(pk)return choose(pk.dataset.pick);
    const fb=e.target.closest("[data-f]");if(fb){f=fb.dataset.f;m.querySelectorAll("[data-f]").forEach(b=>b.classList.toggle("on",b===fb));return draw()}
    const tb=e.target.closest("[data-t]");if(tb){m.querySelector(".body").dataset.tab=tb.dataset.t;m.querySelectorAll("[data-t]").forEach(b=>b.classList.toggle("on",b===tb));return}
    const it=e.target.closest(".pt,.pin");if(it){cur=it.dataset.id;draw();if(it.classList.contains("pin")){const el=m.querySelector(`.pt[data-id="${cur}"]`);el&&el.scrollIntoView({block:"nearest",behavior:"smooth"})}}
  });
  m.addEventListener("keydown",e=>{const it=e.target.closest(".pt");if(it&&e.key==="Enter"&&e.target===it)choose(it.dataset.id)});
  m.querySelector("#pq").oninput=e=>{q=e.target.value.trim().toLowerCase();draw()};
  draw();
  if(matchMedia("(min-width:900px)").matches)m.querySelector("#pq").focus();
}

/* ---------- routing ---------- */
let tt;function toast(t){$("#toastTxt").textContent=t;$("#toast").classList.add("on");clearTimeout(tt);tt=setTimeout(()=>$("#toast").classList.remove("on"),3200)}
function go(h){if(location.hash==="#"+h)route();else location.hash=h}
function route(){
  const h=location.hash.slice(1)||"drop";
  const isDrop=h==="drop";
  document.documentElement.classList.toggle("splash-open",isDrop);
  document.body.classList.toggle("splash-open",isDrop);
  $("#splash").classList.toggle("gone",!isDrop);
  $("#splash").inert=!isDrop;
  document.body.classList.toggle("product-open",h.startsWith("hat-"));
  const v=h.startsWith("hat-")?"product":h==="cart"?"cart":"shop";
  document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id==="v-"+v));
  if(v==="product")product(h.slice(4));
  if(v==="cart")cartView();
  window.scrollTo({top:0,behavior:"instant"});

}
document.addEventListener("click",e=>{const t=e.target.closest("[data-go]");if(t){e.preventDefault();e.stopPropagation();if(window.BALON_MENU)BALON_MENU(false);go(t.dataset.go)}});
$("#enter").onclick=()=>go("shop");
addEventListener("hashchange",route);
save();route();
</script>
</body>
</html>
